{% extends 'menus/base.html' %}
{% load static %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<style>
    .button {
        background-color: blue;
        color: white;
        padding: 8px 16px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
    }
    .button:hover {
        background-color: darkblue;
    }
</style>

<div class="container mx-auto p-4 flex">
    <div class="grid grid-col-4 gap-4">

        {% if product.image %}
            <img src="{{product.image.url }}" alt="{{ product.name }}" class="max-h-[80vh]">
        {% else %}
            <p>The image is not available</p>
        {% endif %}

        <h3 class="font-semibold mt-4">{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <p class="text-indigo-600 font-semibold">{{ product.price }}</p>

        
    </div>
</div>



{% endblock %}
