{% extends 'menus/base.html'%}
{% load static %}
{% block content%}
<style>
    .button{
        background-color: blue;
        color:white;
        padding: 2px 1px;
       font-weight: 600;
       border-radius: 50px;

    }

</style>
        <body>
            <a href="/">home</a>
            <h2>product views </h2>
            <div class="row">
    
        
                <div class="container mx-auto p-4 flex">
    <div class="grid grid-col-4 gap-4">

        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="max-h-[80vh]">
        {% else %}
            <p>The image is not available</p>
        {% endif %}

        <h3 class="font-semibold mt-4">{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <p class="text-indigo-600 font-semibold">{{ product.price }}</p>


            </div>
            </div>
            </div>
            </div>
        </body>
        <form action="{% url 'cart:cart_add' product.id %}" method="post" id="add-to-cart-form">
            {% csrf_token %}
            <button class="button"type='submit'>ADD to CART</button>
            

        </form>
        <br>
        <a href="{% url 'menus:category_list'  %}">
       ← Back to Categories
         </a>
         <script>
document.getElementById('add-to-cart-form').addEventListener("submit", function(event) {
    event.preventDefault();

    const form = event.target;
    const url = form.action;
    const formData = new FormData(form);
    const messageElement = document.getElementById("message");

    fetch(url, {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            messageElement.textContent = data.message;
            messageElement.style.color = "green";
        } else {
            messageElement.textContent = "Failed to add to cart";
            messageElement.style.color = "red";
        }
    })
    .catch(error => {
        console.error("Error:", error);
        messageElement.textContent = "An unexpected error occurred.";
        messageElement.style.color = "red";
    });
});
</script>

    {% endblock%}
